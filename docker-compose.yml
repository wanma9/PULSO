services:
  postgres-plain:
    image: postgres:16-alpine
    container_name: pulse-postgres-plain
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse_plain
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_plain"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_plain_data:/var/lib/postgresql/data
      - ./backend/sql/init-plain.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  postgres-timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: pulse-postgres-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse_timescale
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_timescale"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - postgres_timescale_data:/var/lib/postgresql/data
      - ./backend/sql/init-timescale.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  api-plain:
    build: ./backend
    container_name: pulse-api-plain
    restart: unless-stopped
    depends_on:
      postgres-plain:
        condition: service_healthy
    environment:
      DB_MODE: plain
      PORT: 4001
      DB_HOST: postgres-plain
      DB_PORT: 5432
      DB_NAME: pulse_plain
      DB_USER: pulse
      DB_PASSWORD: pulse
      CORS_ORIGIN: http://localhost:5173,http://localhost:8081
      SIMULATOR_INTERVAL_MS: 2000
    ports:
      - "4001:4001"

  api-timescale:
    build: ./backend
    container_name: pulse-api-timescale
    restart: unless-stopped
    depends_on:
      postgres-timescale:
        condition: service_healthy
    environment:
      DB_MODE: timescale
      PORT: 4002
      DB_HOST: postgres-timescale
      DB_PORT: 5432
      DB_NAME: pulse_timescale
      DB_USER: pulse
      DB_PASSWORD: pulse
      CORS_ORIGIN: http://localhost:5173,http://localhost:8081
      SIMULATOR_INTERVAL_MS: 2000
    ports:
      - "4002:4002"

volumes:
  postgres_plain_data:
  postgres_timescale_data:
